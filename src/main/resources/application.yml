server:
  port: ${PORT:8080}

spring:
  application:
    name: tvmaze-api
  data:
    mongodb:
      # Cadena de conexión de MongoDB Atlas. Se lee de la variable de entorno MONGODB_URI
      # para no guardar credenciales en el repositorio.
      uri: ${MONGODB_URI:mongodb://localhost:27017/tvmaze}
      auto-index-creation: true
  jackson:
    deserialization:
      # Evita que un rating como 4.5 se convierta silenciosamente en 4
      accept-float-as-int: false

tvmaze:
  api:
    base-url: https://api.tvmaze.com
    connect-timeout: 5s
    read-timeout: 10s
